name: Apple 构建与运行检查
run-name: Apple · ${{ inputs.candidate || 'apple-candidate' }}
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: 本仓库的候选分支或完整提交 SHA
        required: true
        default: apple-candidate
        type: string
      package_run:
        description: 复验本工作流已有候选包时填入原构建的运行编号
        required: false
        type: string
      suite:
        description: 仅接受本工作流已核定摘要的脱敏验收文件（Base64）
        required: false
        type: string
      scope:
        description: 复验全部目标，或仅比较相邻模拟器运行时
        type: choice
        options: [full, runtime, phone, media, queue, privacy, layout, capture, review, write, native, record, contract, movie, game, audio, domains, reading, pictures, tavern, setup, shelf, collection, mac-domains, mac-shelf, mac-setup, migration, download-actions, discovery-scope, full-history, download-entry, shelf-display, detail-sections, host-actions, host-tags, host-directory, host-preview, host-preview-mac, storage, domain-recheck]
        default: full
permissions:
  contents: read
jobs:
  environment:
    if: ${{ !inputs.package_run }}
    name: Xcode 和模拟器可用性
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -showsdks
          python3 ci/simulator.py check
  candidate:
    if: ${{ !inputs.package_run }}
    name: 候选构建、打包和启动
    runs-on: macos-15
    timeout-minutes: 150
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate }}
          path: candidate
          persist-credentials: false
      - name: 记录候选和实际工具版本
        run: |
          set -euo pipefail
          mkdir -p test/evidence
          git -C candidate rev-parse HEAD | tee test/evidence/candidate.txt
          xcodebuild -version | tee test/evidence/xcode.txt
          xcrun simctl list runtimes | tee test/evidence/runtimes.txt
          df -h .
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 安装构建依赖
        working-directory: candidate
        run: |
          set -euo pipefail
          rustup update stable --no-self-update
          rustup default stable
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios aarch64-apple-darwin x86_64-apple-darwin
          cd clients/web
          npm install -g "$(node -p 'require("./package.json").packageManager')"
          pnpm --filter '@hentai-park/source-runner...' install --frozen-lockfile
      - name: 构建 Rust 绑定和 Apple 应用
        working-directory: candidate
        run: |
          set -euo pipefail
          python3 tools/build_apple_core.py
      - id: package
        name: 生成侧载和桌面产物
        run: bash ci/package.sh
      - name: 复验桌面候选所用绑定与共享契约
        if: inputs.scope == 'contract'
        env:
          CONTRACT_INPUT: ${{ inputs.suite }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, sqlite3
          from pathlib import Path
          raw = base64.b64decode(os.environ["CONTRACT_INPUT"], validate=True)
          assert hashlib.sha256(raw).hexdigest() == "f9127ac4f28e18fb66de4f28f91e9bb09823e3c102245418a6c677e00ae222b8"
          bundle = json.loads(raw)
          root = Path("test/contract")
          root.mkdir()
          for name in ("fixture.json", "SharedProbe.swift", "lock.c"):
              (root / name).write_text(bundle[name])
          data = json.loads(bundle["fixture.json"])
          (root / "expected.json").write_text(json.dumps(bundle["expected"]))
          store = Path("/tmp/atlas/park")
          store.mkdir(parents=True)
          with sqlite3.connect(store / "park.db") as db:
              db.executescript(Path("candidate/native/park-storage/src/schema.sql").read_text())
              db.executemany("INSERT INTO works(source,id,title) VALUES(?,?,'Atlas')", [(data["source"], v) for v in data["ids"]])
              db.execute("PRAGMA user_version=10")
          PY
          clang test/contract/lock.c -lsqlite3 -o /tmp/atlas-lock
          apple=candidate/clients/apple
          lib=("$apple"/Generated/park_ffiFFI.xcframework/macos-*/libpark_ffi.a)
          swiftc -swift-version 5 -I "$(dirname "${lib[0]}")/Headers" "$apple"/Sources/ParkCore/*.swift test/contract/SharedProbe.swift "${lib[0]}" -framework CoreFoundation -framework Security -o test/contract/probe
          test/contract/probe > test/contract/observed.json
          python3 - <<'PY'
          import hashlib, json, platform
          from pathlib import Path
          digest = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          root = Path("test/contract")
          observed = json.loads((root / "observed.json").read_bytes())
          observed["input"] = digest(root / "fixture.json")
          expected = json.loads((root / "expected.json").read_bytes())
          assert {k: observed[k] for k in expected} == expected
          apple = Path("candidate/clients/apple")
          observed.update(appleLibrary=digest(next(apple.glob("Generated/*.xcframework/macos-*/libpark_ffi.a"))),
                          binding=digest(apple / "Sources/ParkCore/park_ffi.swift"), os=platform.mac_ver()[0],
                          package=digest(Path("test/packages/HentaiPark-macOS-adhoc.zip")))
          Path("test/evidence/contract.json").write_text(json.dumps(observed, indent=2))
          PY
      - name: 启动 macOS 客户端
        run: bash ci/macos.sh
      - name: 依次启动 iPhone 和 iPad 客户端
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: python3 ci/simulator.py launch
      - name: 保存应用与证据
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: apple-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test/evidence/
            test/packages/
          retention-days: 7
  exercise:
    name: 已打包客户端业务验证 · ${{ matrix.host }} ${{ matrix.runtime }}
    if: ${{ inputs.package_run != '' }}
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(contains(fromJSON('["queue","privacy","layout","capture","review","write","record","mac-domains","mac-shelf","mac-setup","host-preview-mac"]'), inputs.scope) && '[{"host":"macOS","runtime":"host"}]'
          || contains(fromJSON('["media","download-actions","discovery-scope","migration","full-history","download-entry","shelf-display","detail-sections","host-actions","host-tags","host-directory","host-preview","storage"]'), inputs.scope) && '[{"host":"macOS","runtime":"host"},{"host":"iPhone","runtime":"18.6"},{"host":"iPad","runtime":"26.2"}]'
          || inputs.scope == 'audio' && '[{"host":"iPhone","runtime":"18.6"}]'
          || inputs.scope == 'domain-recheck' && '[{"host":"iPhone","runtime":"18.6"}]'
          || contains(fromJSON('["movie","domains","reading","pictures","tavern","setup","shelf","collection","game"]'), inputs.scope) && '[{"host":"iPhone","runtime":"18.6"},{"host":"iPad","runtime":"26.2"}]'
          || inputs.scope == 'native' && '[{"host":"iPhone","runtime":"26.2"},{"host":"iPad","runtime":"26.2"}]'
          || inputs.scope == 'phone' && '[{"host":"iPhone","runtime":"26.2"}]' || inputs.scope == 'runtime'
          && '[{"host":"iPhone","runtime":"18.5"},{"host":"iPhone","runtime":"18.6"}]'
          || '[{"host":"iPhone","runtime":"18.6"},{"host":"iPad","runtime":"18.6"},{"host":"iPhone","runtime":"26.2"},{"host":"iPad","runtime":"26.2"},{"host":"macOS","runtime":"host"}]') }}
    env:
      PACKAGE_RUN: ${{ inputs.package_run }}
      CANDIDATE_SHA: ${{ inputs.candidate }}
      HOST_KIND: ${{ matrix.host }}
      SIMULATOR_RUNTIME: ${{ matrix.runtime }}
      EXERCISE_SCOPE: ${{ inputs.scope }}
    steps:
      - name: 核对本仓库的构建运行与验收文件摘要
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_SUITE: ${{ inputs.suite }}
        run: |
          set -euo pipefail
          [[ "$PACKAGE_RUN" =~ ^[0-9]+$ && "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p test/ui-evidence
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PACKAGE_RUN" > test/build.json
          python3 - <<'PY'
          import base64, hashlib, hmac, json, os, pathlib
          run = json.loads(pathlib.Path("test/build.json").read_text())
          if (run["path"] != ".github/workflows/apple.yml" or run["event"] != "workflow_dispatch"
                  or run["head_branch"] != "main" or run["status"] != "completed"
                  or run["display_title"] != "Apple · " + os.environ["CANDIDATE_SHA"]):
              raise SystemExit("构建运行与指定候选或工作流不一致")
          raw = base64.b64decode(os.environ["REVIEWED_SUITE"], validate=True)
          if not hmac.compare_digest(hashlib.sha256(raw).hexdigest(),
                                     "7e3cffb7164fa2a6936a28063262c5f732953cf5c1673befa33e3f21184027c4" if os.environ["EXERCISE_SCOPE"] == "storage" else
                                     "d3b66cf8e6771f6d1117bb2ca8d4204d0f12c53c8a053d80a5a324d7a01e73f5" if os.environ["EXERCISE_SCOPE"] == "full-history" else
                                     "9dc137fa6f259cfb761d812a63cbd7e0c9927f23fb75cc4183e3192b06422407" if os.environ["EXERCISE_SCOPE"] == "download-entry" else
                                     "cb12c586ee3213b7cf2a80ec5a066a6b437013f558eb145b2f263808a0d3df36" if os.environ["EXERCISE_SCOPE"] == "shelf-display" else
                                     "5b385c5fad0bdb55b36fa7d9ee0fb240d672e7b2e4ceb1f135161aee20bd5dd4" if os.environ["EXERCISE_SCOPE"] == "host-preview-mac" else
                                     "ffe771be9e821a3e6e75d960d54f1c9fa81d5a5dd5c57064aa926d649f4f1128" if os.environ["EXERCISE_SCOPE"] == "host-preview" else
                                     "9b2fb87f5a5b1520462dba32b73f020d79843bb3922658639fb206942478f2f8" if os.environ["EXERCISE_SCOPE"] == "host-tags" else
                                     "fa50f9d3dfb7a9dafbda5c01781e87b72b0e528cc9ea2537266b595ad8a7ab97" if os.environ["EXERCISE_SCOPE"] == "host-directory" else
                                     "d6308468e3dbe604f9c0d9cfcf94ea375619cd0a9a968aae9e5023a89dec4d61" if os.environ["EXERCISE_SCOPE"] == "host-actions" else
                                     "fdaf167c7839870c77b0c2efcb178adf5eef6ff3d3c0831c35c015a33f7b05d3" if os.environ["EXERCISE_SCOPE"] == "detail-sections" else
                                     "805376221ef5abd35787d255de5282fa51dbee63dd1d4c56403e3ea470254a8b" if os.environ["EXERCISE_SCOPE"] == "discovery-scope" else
                                     "5e3dcf168c2128d6d2a4dc9a65b6644e8a13d313a3aedb1636e12c0437d5813d" if os.environ["EXERCISE_SCOPE"] == "download-actions" else
                                     "30785acdc161f1d9f3c3181827e7e1685e9ec7b182de155c0ebfa9c78540be2b" if os.environ["EXERCISE_SCOPE"] == "setup" else
                                     "e8b98734706140939a2157137a73df73e00e69617f54602885bf2fb9b0be1d4a" if os.environ["EXERCISE_SCOPE"] == "shelf" else
                                     "a36fd8f574664d8c1f59cef6ee8690989d12aaf98ee2b3154d3cb615251b4bee" if os.environ["EXERCISE_SCOPE"] == "collection" else
                                     "59ed9cfc798d61a81f577a339a1ab9039b387c8735206f867f872d511b45a2d0" if os.environ["EXERCISE_SCOPE"] == "migration" else
                                     "a9a8e96be0096f2663d09859534f85c95f0cb2a0492bcd7bdb4240d5f628c5bf" if os.environ["EXERCISE_SCOPE"] == "mac-shelf" else
                                     "669521c98b5c8d9d1022acbd2f83973c28bd51d34fb3e96ad733f3db473b2f90" if os.environ["EXERCISE_SCOPE"] == "mac-domains" else
                                     "b484cedcd8968456373b0f1fa3b58dc36f4b662f21839fecf9eeb0416c833161" if os.environ["EXERCISE_SCOPE"] == "mac-setup" else
                                     "29c666e8563a003adeefff2d3eaefd41b9266257fbce98a0ee7fe015744f9ce6" if os.environ["EXERCISE_SCOPE"] == "tavern" else
                                     "20f343939ddfb2059babd083cd3ce5de23f2df26c501a48ddf67260c16f808dc" if os.environ["EXERCISE_SCOPE"] == "pictures" else
                                     "ab6f6c0f95bdb1dfee1451fe8d46f360c7bc6b8563248aec727a9f371d832b12" if os.environ["EXERCISE_SCOPE"] == "reading" else
                                     "ab6f6c0f95bdb1dfee1451fe8d46f360c7bc6b8563248aec727a9f371d832b12" if os.environ["EXERCISE_SCOPE"] == "domain-recheck" else
                                     "ab6f6c0f95bdb1dfee1451fe8d46f360c7bc6b8563248aec727a9f371d832b12" if os.environ["EXERCISE_SCOPE"] == "domains" else
                                     "13097a802666e7185816de889c4a43dbe95254e754bde72f52d7cdee380b0cbd" if os.environ["EXERCISE_SCOPE"] == "audio" else
                                     "35f0eaf2702704ada46d90edffdbf8f8d1a7b0090a486735d149f10dd74c024e" if os.environ["EXERCISE_SCOPE"] == "game" else
                                     "9bb3449e17df96b77aa619cb82c964704babcea162b2caae04c22e9daa56944e" if os.environ["EXERCISE_SCOPE"] == "movie" else
                                     "4eb1916eaa9a069036187764ea19d94787042199139ad2a2acf33bf207c572bb" if os.environ["EXERCISE_SCOPE"] == "record" else
                                     "379dfddc9c7b95cb387352ccd826cbd3dd79d321932b9d503f2c21262b4bfb4c" if os.environ["EXERCISE_SCOPE"] == "native" else
                                     "5fdb068d64b89ac940d866eb6167b66a6eeed28902ff83fbfada2faa8f9442cb" if os.environ["EXERCISE_SCOPE"] == "review" else
                                     "bd1c214f5e0397c1433247be1622b1a1080947c3a764c211ed880bfe38318f85" if os.environ["EXERCISE_SCOPE"] == "write" else
                                     "a7d90d961e0d02a256865f2e881cef0d5279930e1df30869a0b22564ef007410" if os.environ["EXERCISE_SCOPE"] in ("capture","layout") else
                                     "e30a8dba8f2eb14637bf5e349b431d372c4b0edf32ca57b85599b13fb0950f71" if os.environ["EXERCISE_SCOPE"] == "queue" else
                                     "28935d4118426ff137a68989b9c0081e9dd90f52fcb489713407235a27f1d3e0" if os.environ["EXERCISE_SCOPE"] == "media" else
                                     "32a789336586216e79c700851042714c21a0aebdccbe9dcac32eac04068e7b9f"):
              raise SystemExit("验收文件摘要与工作流核定值不一致")
          pathlib.Path("test/reader_flow.py").write_bytes(raw)
          PY
          attempt=$(jq -r '.run_attempt' test/build.json)
          gh run download "$PACKAGE_RUN" -R "$GITHUB_REPOSITORY" -n "apple-$PACKAGE_RUN-$attempt" -D test/artifact
          [[ "$(cat test/artifact/evidence/candidate.txt)" == "$CANDIDATE_SHA" ]]
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 启动候选并记录系统入口与持久化结果
        run: |
          set -euo pipefail
          if [[ "$SIMULATOR_RUNTIME" == 26.2 ]]; then
            export DEVELOPER_DIR=/Applications/Xcode_26.2.app/Contents/Developer
            xcodebuild -version
            if [[ "$EXERCISE_SCOPE" != native && "$EXERCISE_SCOPE" != domains && "$EXERCISE_SCOPE" != domain-recheck && "$EXERCISE_SCOPE" != reading && "$EXERCISE_SCOPE" != pictures && "$EXERCISE_SCOPE" != tavern && "$EXERCISE_SCOPE" != setup && "$EXERCISE_SCOPE" != shelf && "$EXERCISE_SCOPE" != collection && "$EXERCISE_SCOPE" != migration && "$EXERCISE_SCOPE" != movie && "$EXERCISE_SCOPE" != game ]]; then
              npm install -g appium@3.1.2
              appium driver install xcuitest@11.5.0
            fi
          elif [[ "$HOST_KIND" == macOS ]] || [[ "$EXERCISE_SCOPE" != movie && "$EXERCISE_SCOPE" != game && "$EXERCISE_SCOPE" != domains && "$EXERCISE_SCOPE" != domain-recheck && "$EXERCISE_SCOPE" != reading && "$EXERCISE_SCOPE" != pictures && "$EXERCISE_SCOPE" != tavern && "$EXERCISE_SCOPE" != setup && "$EXERCISE_SCOPE" != shelf && "$EXERCISE_SCOPE" != collection && "$EXERCISE_SCOPE" != migration && "$EXERCISE_SCOPE" != audio ]]; then
            npm install -g appium@2.19.0
            if [[ "$HOST_KIND" == macOS ]]; then
              appium driver install mac2@2.2.2
            else
              appium driver install xcuitest@9.10.5
            fi
          fi
          python -m venv test/venv
          test/venv/bin/python -m pip install --disable-pip-version-check Pillow==11.3.0
          if [[ "$EXERCISE_SCOPE" == media || "$EXERCISE_SCOPE" == record || "$EXERCISE_SCOPE" == movie || "$EXERCISE_SCOPE" == audio ]]; then
            test/venv/bin/python -m pip install --disable-pip-version-check imageio-ffmpeg==0.6.0
          fi
          if [[ "$EXERCISE_SCOPE" == record ]]; then
            test/venv/bin/python -m pip install --disable-pip-version-check opencv-python-headless==4.11.0.86
          fi
          test/venv/bin/python -I test/reader_flow.py
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ui-${{ matrix.host }}-${{ matrix.runtime }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test/ui-evidence/
          retention-days: 7

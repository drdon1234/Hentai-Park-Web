      - uses: actions/checkout@v4
        timeout-minutes: 2
        with:
          ref: ${{ github.sha }}
          path: test/host-workflow
          sparse-checkout: .github/actions/apple-host-clock
          persist-credentials: false
      - uses: actions/setup-node@v4
        timeout-minutes: 2
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        timeout-minutes: 2
        with:
          python-version: '3.12'
      - name: 准备宿主驱动与 Python 依赖
        run: |
          set -euo pipefail
          clock=test/host-workflow/.github/actions/apple-host-clock/clock.py
          python3 -I "$clock" init
          python3 -I "$clock" watch dependencies bash -se <<'HOST_DEPS'
          set -euo pipefail
          if [[ "$SIMULATOR_RUNTIME" == 26.2 ]]; then
            export DEVELOPER_DIR=/Applications/Xcode_26.2.app/Contents/Developer
            echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
            xcodebuild -version
            if [[ "$EXERCISE_SCOPE" != native && "$EXERCISE_SCOPE" != domains && "$EXERCISE_SCOPE" != domain-recheck && "$EXERCISE_SCOPE" != reading && "$EXERCISE_SCOPE" != pictures && "$EXERCISE_SCOPE" != tavern && "$EXERCISE_SCOPE" != setup && "$EXERCISE_SCOPE" != host-reader-touch && "$EXERCISE_SCOPE" != host-onboarding-cancel && "$EXERCISE_SCOPE" != host-queue-batch && "$EXERCISE_SCOPE" != host-comment-cursor && "$EXERCISE_SCOPE" != host-edition-scope && "$EXERCISE_SCOPE" != host-shelf-selection && "$EXERCISE_SCOPE" != host-chapter-persistence && "$EXERCISE_SCOPE" != host-site-options && "$EXERCISE_SCOPE" != unified-* && "$EXERCISE_SCOPE" != host-site-options-timed && "$EXERCISE_SCOPE" != host-reader-modes && "$EXERCISE_SCOPE" != shelf && "$EXERCISE_SCOPE" != collection && "$EXERCISE_SCOPE" != migration && "$EXERCISE_SCOPE" != movie && "$EXERCISE_SCOPE" != game || "$EXERCISE_SCOPE" == unified-lock-recovery || "$EXERCISE_SCOPE" == unified-onboarding-biometric ]]; then
              npm install -g appium@3.1.2
              appium driver install xcuitest@11.5.0
            fi
          elif [[ "$HOST_KIND" == macOS ]] || [[ "$EXERCISE_SCOPE" != movie && "$EXERCISE_SCOPE" != game && "$EXERCISE_SCOPE" != domains && "$EXERCISE_SCOPE" != domain-recheck && "$EXERCISE_SCOPE" != reading && "$EXERCISE_SCOPE" != pictures && "$EXERCISE_SCOPE" != tavern && "$EXERCISE_SCOPE" != setup && "$EXERCISE_SCOPE" != host-reader-touch && "$EXERCISE_SCOPE" != host-onboarding-cancel && "$EXERCISE_SCOPE" != host-queue-batch && "$EXERCISE_SCOPE" != host-comment-cursor && "$EXERCISE_SCOPE" != host-edition-scope && "$EXERCISE_SCOPE" != host-shelf-selection && "$EXERCISE_SCOPE" != host-chapter-persistence && "$EXERCISE_SCOPE" != host-site-options && "$EXERCISE_SCOPE" != unified-* && "$EXERCISE_SCOPE" != host-site-options-timed && "$EXERCISE_SCOPE" != host-reader-modes && "$EXERCISE_SCOPE" != shelf && "$EXERCISE_SCOPE" != collection && "$EXERCISE_SCOPE" != migration && "$EXERCISE_SCOPE" != audio || "$EXERCISE_SCOPE" == unified-lock-recovery || "$EXERCISE_SCOPE" == unified-onboarding-biometric ]]; then
            npm install -g appium@2.19.0
            if [[ "$HOST_KIND" == macOS ]]; then
              appium driver install mac2@2.2.2
            else
              appium driver install xcuitest@9.10.5
            fi
          fi
          python -m venv test/venv
          test/venv/bin/python -m pip install --disable-pip-version-check Pillow==11.3.0
          if [[ "$EXERCISE_SCOPE" == media || "$EXERCISE_SCOPE" == record || "$EXERCISE_SCOPE" == movie || "$EXERCISE_SCOPE" == audio || "$EXERCISE_SCOPE" == unified-reader-animation ]]; then
            test/venv/bin/python -m pip install --disable-pip-version-check imageio-ffmpeg==0.6.0
          fi
          if [[ "$EXERCISE_SCOPE" == record ]]; then
            test/venv/bin/python -m pip install --disable-pip-version-check opencv-python-headless==4.11.0.86
          fi
          HOST_DEPS
      - name: 启动候选并记录系统入口与持久化结果
        run: |
          set -euo pipefail
          python3 -I test/host-workflow/.github/actions/apple-host-clock/clock.py watch suite test/venv/bin/python -I test/reader_flow.py
      - name: 保存准备阶段结果
        if: ${{ always() }}
        timeout-minutes: 1
        env:
          HOST_JOB_RESULT: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,time
          p=pathlib.Path('test/ui-evidence/preparation.json')
          if p.exists():
              v=json.loads(p.read_bytes())
              if v['result']=='start':
                  v.update(end=time.time(),result=os.environ['HOST_JOB_RESULT'])
                  v['seconds']=round(v['end']-v['start'],3)
                  p.write_text(json.dumps(v))
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        timeout-minutes: 4
        with:
          name: ui-${{ matrix.host }}-${{ matrix.runtime }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test/ui-evidence/
          retention-days: 7

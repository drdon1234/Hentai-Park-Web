name: Apple 构建与运行检查
run-name: Apple · ${{ inputs.candidate || 'apple-candidate' }}
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: 本仓库的候选分支或完整提交 SHA
        required: true
        default: apple-candidate
        type: string
      package_run:
        description: 复验本工作流已有候选包时填入原构建的运行编号
        required: false
        type: string
      suite:
        description: 仅接受本工作流已核定摘要的脱敏验收文件（Base64）
        required: false
        type: string
      scope:
        description: 复验全部目标，或仅比较相邻模拟器运行时
        type: choice
        options: [full, runtime, phone, media, queue, privacy, layout, capture, review, write, native, record, contract, movie, game, audio, domains, reading, pictures, tavern, setup, host-reader-touch, host-onboarding-cancel, shelf, collection, mac-domains, mac-shelf, mac-setup, migration, download-actions, discovery-scope, full-history, download-entry, shelf-display, detail-sections, host-actions, host-tags, host-directory, host-metadata, host-update-route, host-update-management, host-chapter-actions, host-queue-batch, host-reader-modes, host-dictionaries, host-record-recovery, host-download-media, host-game-resources, host-comic-export, host-categories, host-categories-empty, host-feed-pages, host-comments, host-comment-link, host-comment-cursor, host-edition-scope, host-shelf-selection, host-chapter-persistence, host-site-options, host-site-options-timed, host-favorites, host-preview, host-preview-mac, host-categories-mac, host-feed-pages-mac, host-tag-pages-mac, host-favorite-windows, storage, domain-recheck, unified-reference-scope, unified-album-dates, unified-home-section, unified-home-saver, unified-connection-settings, unified-episode-transfer, unified-game-files, unified-game-browser, unified-episode-share, unified-movie-hold, unified-reader-original, unified-reader-visible-page, unified-reader-photos, unified-reader-zoom, unified-reader-zones, unified-reader-display, unified-reader-swipe, unified-reader-keys, unified-game-inflight, unified-queue-background, unified-queue-reconnect, unified-reader-spreads, unified-reader-gap, unified-reader-crop, unified-edition-mac, unified-reader-orientation, unified-reader-window, unified-display-pane, unified-first-mac-auth, unified-setup-screen, unified-reader-awake, unified-subscription-timer, unified-reader-animation, unified-mac-lock-cold, unified-mac-lock-owner, unified-lock-recovery, unified-lock-owner-cancel, unified-onboarding-biometric, unified-inline-queue, unified-reader-navigation, unified-game-consent, unified-album-catalog, unified-album-preview, unified-preview-pagination, unified-chapter-persistence-batch, unified-history-scope-batch, unified-download-removal, unified-chapter-queue, unified-export-share, unified-official-packs, unified-site-management, unified-archive-import, unified-archive-removal, unified-author-check, unified-damaged-files, unified-download-settings, unified-group-results, unified-history-menu, unified-pdf-volumes, unified-post-cursor, unified-shelf-scope, unified-first-interests, unified-first-defaults, unified-settings-appearance, unified-subscription-settings, unified-translation-retry, unified-tag-guide]
        default: full
permissions:
  contents: read
jobs:
  environment:
    if: ${{ !inputs.package_run }}
    name: Xcode 和模拟器可用性
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -showsdks
          python3 ci/simulator.py check
  candidate:
    if: ${{ !inputs.package_run }}
    name: 候选构建、打包和启动
    runs-on: macos-15
    timeout-minutes: 150
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate }}
          path: candidate
          persist-credentials: false
      - name: 记录候选和实际工具版本
        run: |
          set -euo pipefail
          mkdir -p test/evidence
          git -C candidate rev-parse HEAD | tee test/evidence/candidate.txt
          xcodebuild -version | tee test/evidence/xcode.txt
          xcrun simctl list runtimes | tee test/evidence/runtimes.txt
          df -h .
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 安装构建依赖
        working-directory: candidate
        run: |
          set -euo pipefail
          rustup update stable --no-self-update
          rustup default stable
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios aarch64-apple-darwin x86_64-apple-darwin
          cd clients/web
          npm install -g "$(node -p 'require("./package.json").packageManager')"
          pnpm --filter '@hentai-park/source-runner...' install --frozen-lockfile
      - name: 构建 Rust 绑定和 Apple 应用
        working-directory: candidate
        run: |
          set -euo pipefail
          python3 tools/build_apple_core.py
      - id: package
        name: 生成侧载和桌面产物
        run: bash ci/package.sh
      - name: 复验桌面候选所用绑定与共享契约
        if: inputs.scope == 'contract'
        env:
          CONTRACT_INPUT: ${{ inputs.suite }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, sqlite3
          from pathlib import Path
          raw = base64.b64decode(os.environ["CONTRACT_INPUT"], validate=True)
          assert hashlib.sha256(raw).hexdigest() == "f9127ac4f28e18fb66de4f28f91e9bb09823e3c102245418a6c677e00ae222b8"
          bundle = json.loads(raw)
          root = Path("test/contract")
          root.mkdir()
          for name in ("fixture.json", "SharedProbe.swift", "lock.c"):
              (root / name).write_text(bundle[name])
          data = json.loads(bundle["fixture.json"])
          (root / "expected.json").write_text(json.dumps(bundle["expected"]))
          store = Path("/tmp/atlas/park")
          store.mkdir(parents=True)
          with sqlite3.connect(store / "park.db") as db:
              db.executescript(Path("candidate/native/park-storage/src/schema.sql").read_text())
              db.executemany("INSERT INTO works(source,id,title) VALUES(?,?,'Atlas')", [(data["source"], v) for v in data["ids"]])
              db.execute("PRAGMA user_version=10")
          PY
          clang test/contract/lock.c -lsqlite3 -o /tmp/atlas-lock
          apple=candidate/clients/apple
          lib=("$apple"/Generated/park_ffiFFI.xcframework/macos-*/libpark_ffi.a)
          swiftc -swift-version 5 -I "$(dirname "${lib[0]}")/Headers" "$apple"/Sources/ParkCore/*.swift test/contract/SharedProbe.swift "${lib[0]}" -framework CoreFoundation -framework Security -o test/contract/probe
          test/contract/probe > test/contract/observed.json
          python3 - <<'PY'
          import hashlib, json, platform
          from pathlib import Path
          digest = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          root = Path("test/contract")
          observed = json.loads((root / "observed.json").read_bytes())
          observed["input"] = digest(root / "fixture.json")
          expected = json.loads((root / "expected.json").read_bytes())
          assert {k: observed[k] for k in expected} == expected
          apple = Path("candidate/clients/apple")
          observed.update(appleLibrary=digest(next(apple.glob("Generated/*.xcframework/macos-*/libpark_ffi.a"))),
                          binding=digest(apple / "Sources/ParkCore/park_ffi.swift"), os=platform.mac_ver()[0],
                          package=digest(Path("test/packages/HentaiPark-macOS-adhoc.zip")))
          Path("test/evidence/contract.json").write_text(json.dumps(observed, indent=2))
          PY
      - name: 启动 macOS 客户端
        run: bash ci/macos.sh
      - name: 依次启动 iPhone 和 iPad 客户端
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: python3 ci/simulator.py launch
      - name: 保存应用与证据
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: apple-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test/evidence/
            test/packages/
          retention-days: 7
  exercise:
    name: 已打包客户端业务验证 · ${{ matrix.host }} ${{ matrix.runtime }}
    if: ${{ inputs.package_run != '' }}
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(contains(fromJSON('["queue","privacy","layout","capture","review","write","record","mac-domains","mac-shelf","mac-setup","host-preview-mac","host-categories-mac","host-feed-pages-mac","host-tag-pages-mac","host-favorite-windows"]'), inputs.scope) && '[{"host":"macOS","runtime":"host"}]'
          || contains(fromJSON('["unified-reference-scope","unified-album-dates","unified-home-section","unified-home-saver","unified-episode-transfer","unified-game-files","unified-game-browser","unified-episode-share","unified-movie-hold","unified-reader-original","unified-reader-visible-page","unified-reader-photos","unified-reader-zoom","unified-reader-zones","unified-reader-display","unified-reader-swipe","unified-reader-keys","unified-game-inflight","unified-queue-background","unified-queue-reconnect","unified-reader-spreads","unified-reader-gap","unified-reader-crop","unified-setup-screen","unified-reader-awake","unified-subscription-timer","unified-reader-animation","unified-inline-queue","unified-reader-navigation","unified-game-consent","unified-album-catalog","unified-album-preview","unified-preview-pagination","unified-history-scope-batch","unified-download-removal","unified-chapter-queue","unified-export-share","unified-official-packs","unified-site-management","unified-archive-import","unified-archive-removal","unified-author-check","unified-damaged-files","unified-download-settings","unified-group-results","unified-history-menu","unified-pdf-volumes","unified-post-cursor","unified-shelf-scope","unified-first-interests","unified-first-defaults","unified-settings-appearance","unified-subscription-settings","unified-translation-retry","unified-tag-guide"]'), inputs.scope) && '[{"host":"iPhone","runtime":"18.6"},{"host":"iPad","runtime":"26.2"},{"host":"macOS","runtime":"host"}]'
          || contains(fromJSON('["unified-connection-settings","unified-reader-orientation","unified-lock-recovery","unified-onboarding-biometric"]'), inputs.scope) && '[{"host":"iPhone","runtime":"18.6"},{"host":"iPad","runtime":"26.2"}]'
          || contains(fromJSON('["unified-edition-mac","unified-reader-window","unified-display-pane","unified-first-mac-auth","unified-mac-lock-cold","unified-mac-lock-owner","unified-lock-owner-cancel","unified-chapter-persistence-batch"]'), inputs.scope) && '[{"host":"macOS","runtime":"host"}]'
          || contains(fromJSON('["host-site-options-timed"]'), inputs.scope) && '[{"host":"iPhone","runtime":"18.6"},{"host":"macOS","runtime":"host"}]'
          || contains(fromJSON('["media","download-actions","discovery-scope","migration","full-history","download-entry","shelf-display","detail-sections","host-actions","host-tags","host-directory","host-metadata","host-update-route","host-update-management","host-chapter-actions","host-queue-batch","host-reader-modes","host-dictionaries","host-record-recovery","host-download-media","host-game-resources","host-comic-export","host-categories","host-categories-empty","host-feed-pages","host-comments","host-comment-link","host-comment-cursor","host-edition-scope","host-shelf-selection","host-chapter-persistence","host-site-options","host-favorites","host-preview","storage"]'), inputs.scope) && '[{"host":"macOS","runtime":"host"},{"host":"iPhone","runtime":"18.6"},{"host":"iPad","runtime":"26.2"}]'
          || inputs.scope == 'audio' && '[{"host":"iPhone","runtime":"18.6"}]'
          || inputs.scope == 'domain-recheck' && '[{"host":"iPhone","runtime":"18.6"}]'
          || contains(fromJSON('["movie","domains","reading","pictures","tavern","setup","host-reader-touch","host-onboarding-cancel","shelf","collection","game"]'), inputs.scope) && '[{"host":"iPhone","runtime":"18.6"},{"host":"iPad","runtime":"26.2"}]'
          || inputs.scope == 'native' && '[{"host":"iPhone","runtime":"26.2"},{"host":"iPad","runtime":"26.2"}]'
          || inputs.scope == 'phone' && '[{"host":"iPhone","runtime":"26.2"}]' || inputs.scope == 'runtime'
          && '[{"host":"iPhone","runtime":"18.5"},{"host":"iPhone","runtime":"18.6"}]'
          || '[{"host":"iPhone","runtime":"18.6"},{"host":"iPad","runtime":"18.6"},{"host":"iPhone","runtime":"26.2"},{"host":"iPad","runtime":"26.2"},{"host":"macOS","runtime":"host"}]') }}
    env:
      PACKAGE_RUN: ${{ inputs.package_run }}
      CANDIDATE_SHA: ${{ inputs.candidate }}
      HOST_KIND: ${{ matrix.host }}
      SIMULATOR_RUNTIME: ${{ matrix.runtime }}
      EXERCISE_SCOPE: ${{ inputs.scope }}
    steps:
      - name: 核对本仓库的构建运行与验收文件摘要
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_SUITE: ${{ inputs.suite }}
          APPROVED_SUITES: '{"unified-reference-scope":"4823548eff0a6bafc2db5752c384b193d2a883818a4873460d2ee1a81bd2319e","unified-album-dates":"4fe7b250d980e22f61f21a7b25f2715eec8f21da53008b9e7c69073bca0c1d26","unified-home-section":"3ded892a74484ba2902f6923a82f4536e194c276b8913272c2355e702d8d2349","unified-home-saver":"bfed89b6d7f6b933c66a8c1a14b82b8e0c6375efd327fcad1717a40ad28a0213","unified-connection-settings":"5e123a63f64d8cb6c1e170d68841b6408f3c164964c5b8ee5096c36f6b46d041","unified-episode-transfer":"d4069ca2d510d0837e0b6254ecb72e2f6f3b380a5942bc1001e2ef31ef8c6663","unified-game-files":"1ddca2c6e93378b698233f9ef1ee2f1df19434ca407c20d9c019e5f70883073a","unified-game-browser":"9323bad34f90effa187c16dfb81dbe14e08c3184a194625f3aef40f09185613c","unified-episode-share":"066bc9508b62d9f133b065736cc35b9c40c52cfde327be0021fc078542592214","unified-movie-hold":"4f5d4d192fcdd1af906d1ddcdbe90f08643563eac54b8667bd0b961d716e2f82","unified-reader-original":"2518add8573304df128d8932794f160d658df115e9151e122e4e2bccd1e6daf2","unified-reader-visible-page":"e934cf7feea14ef6193f18f943f00a761c932dcdf357cc38117ef5df767e586e","unified-reader-photos":"1cd8a50a4566fedc5cc87925ab206dd347d132078a6e0cea6493441c3775a46b","unified-reader-zoom":"9c7eefaa08c258c38723cd197ee2a9929209e95236530634ffe99adee3a3452b","unified-reader-zones":"03bf6c4631dc7cd346a1212d7d621be9d8101b028f2f591991d6617e27980791","unified-reader-display":"4e1871a80a1086504cb5d27ed296590e38e8410d54253c67e0d650e3fb50af2b","unified-reader-swipe":"117a6160f72b859cc9c4c41986844ebaaa4f3ddd9224a2e96b25e3199ecc0689","unified-reader-keys":"9f78c14323b957ffa24a8e7c13daa62e654e7816dafdadbff17a244c5bc440a3","unified-game-inflight":"20901d9642baa68dbd63d808b10070aecaefdfd3c7c5b187aebba034a0d9e0d4","unified-queue-background":"97582a4af40cc7185fde33f9820fd1f8721628228a5bafb5e91e7e525100824f","unified-queue-reconnect":"74eac60b162195ded6565befe36550ed79ff2b9c9383299ccacd0831d2525d0c","unified-reader-spreads":"a780ba5c89b7a879031cb20b487f6135d4e8aba92d9405d740084e5d29a1a056","unified-reader-gap":"c2a0d68be4913c3e222de47321555315b72cc173c5b93af2d97cdb3acb4cccb4","unified-reader-crop":"6af1770b6e991f745676c55f767aee974f080cfd22d6a459653d7e907cc6432a","unified-edition-mac":"c39827763bc51e0aef5245b141a83aee516a18ed9cd654d0910953b17a30f65f","unified-reader-orientation":"5f8d8b0654c9526f363d324d7e668e634642b17852ea60003e13f3bf38c5f049","unified-reader-window":"1a673a446f52d4aba93431a7072b7ed72fb6bd4d599e00bd8e7907e5d93f8acb","unified-display-pane":"42628b0e64bf2afc143efd1affb3bb8fd853fe468fe0fe5600410670ade6e6a6","unified-first-mac-auth":"595050c8364eef257cae2764343c350913e1eff0e6fc59bd7b883a8e25f95e11","unified-setup-screen":"71f605d90cf65d825e2c02d49d1387d7548a7d14e30d8846289a006797f567e6","unified-reader-awake":"ea7da6bfb71b2562ebb083771752edee2993b3ffb0fccc2144a89e4ddbb9a757","unified-subscription-timer":"dd4eaec5440caf819b8c7778785f9967cdf13d16db5e609d7a682c5ecaee8aea","unified-reader-animation":"9665451e6225270d08e9fbbb5fef4cf53ea76fbf85879551a7880705a22d863f","unified-mac-lock-cold":"1a508162ce0e7b46dd290c39b6a220aff41599246a4d0fb697d51fe6867b21d3","unified-mac-lock-owner":"5eaf26559e85c432c5d231b8b36e9891dfbb4e4be38f2320c2948011fc4efa47","unified-lock-recovery":"c192377a69c199bb47cda3267038cffb7796e32d326c58fcc1780f114a1d4096","unified-lock-owner-cancel":"c192377a69c199bb47cda3267038cffb7796e32d326c58fcc1780f114a1d4096","unified-onboarding-biometric":"8a630be25d737bc4cd60178d45d6930bf9e708d5d1d9e1af519601a69e1be151","unified-inline-queue":"6c6c5cd46ece214e39fffa72edbc31da92fc1abb437d390baa9da25d72fc92b3","unified-reader-navigation":"40cdf57b6f7fcdf8ea3445295b5d08d068b0f5ee546678dc269577f0ddffce73","unified-game-consent":"7eccd558658d0048e648b88535db4245773b7c9050c0e8d0039502bbc97b067c","unified-album-catalog":"cc7f9f96d1c31d6512bc1aa8ca31b37b7502d3b2f2770b2e634284f74dee6973","unified-album-preview":"7918b28109a0e0e7d8fcd880a8e9ea289ae623e55cb25d68a30393cca98caed3","unified-preview-pagination":"90f9e199f23cc030919473699265e88f3b7fa5e15b63ca6a1c6e8de2f99db8f9","unified-chapter-persistence-batch":"5cb48c1fc8e864b4ab2b6e258a45d64c95e48f7e93d7644df011c9abb2832934","unified-history-scope-batch":"73109ae71d15fb14b166b6af96db3967c816622320aeb8caea29eaa6816de9d7","unified-download-removal":"db93acea9f8a000817f16b80b0918a93a6ffb3bc63100df67a2d857aafe4eb18","unified-chapter-queue":"ce5e1b6e6a8ef4795d7bdefe28de1b0a8f0a13c35d48e5a8a6700a2ff6a78f72","unified-export-share":"e7056dc79636660fff0e128db7db0e61f29cbda5d6beb5f55beded6d98da4af6","unified-official-packs":"864b1bb9adaccc34eb284853fc486f256764a00045a03c6fa742f9c80db75785","unified-site-management":"dd7565d5b964c77f970dc22dff6b8d28e1d8614f18904e1d1bb35e33942848cf","unified-archive-import":"a68faa356f1aa60e32d49582c55e43bce2ebc42528c8250b71ee81962750a28a","unified-archive-removal":"a7660b67a8fe1b151d0c766cf9d4477da11f64002e2474aea0d4580cdd20d928","unified-author-check":"be5e7d8ddb45b68c1651fc14d6b4e541946bea72167c349fe346fa593edff6f3","unified-damaged-files":"13129c0f0d8186f02a11ab16feea4732004a4ec5ca22cb7dcdc72c3e108fe96c","unified-download-settings":"b85dd4c4f24a8256848b66b1fd2efd0d5f3c09c231e30bf3c175c4a8421ae6e3","unified-group-results":"d4d666a1ac7c7b21eccd5468abb15bfa300c80be50deb50e1c109c86d4b11ddc","unified-history-menu":"b71c6ae087c1c144ea70ff918c50463a4fe923ef1fd5a5764403e4f40cc063cf","unified-pdf-volumes":"823850d82671aa308289a76f25ab0b2c98f7efa7efe7221a2fe66638a01e23ad","unified-post-cursor":"1659ff20bf186e01e0e7c153e33c2fa7e7e8de7de8019e60ce21d0278845abe9","unified-shelf-scope":"d7f3fc41d4847abecf1ad4a6ff9a0aebdda046c7fd3a49d85408572611168fdb","unified-first-interests":"ce2a487011a9188d5d18c1680d7c102bf0ecbfb5d795ee595f1adbca73d9afcc","unified-first-defaults":"45784dcd09138b30dfc89f0c795662af14913a66ff1d17d906007bbe9420754b","unified-settings-appearance":"8623046b084ec31f202244df68c92f5bcf6e952bc4985dd0c30a179ffb84de6a","unified-subscription-settings":"d9cfad3b052fd0c0b01f5284a9afb19b7b66809c8a4dae4fadb10913539e324f","unified-translation-retry":"a10b5ef9e8741211584bbc5f169400a50a157c0d7d6f1e3c09fad81921c00c40","unified-tag-guide":"a13fc71a5f8eafda25a5fdeaef181e43fac9149a7cb355d261831c718b34c6cf"}'
        run: |
          set -euo pipefail
          [[ "$PACKAGE_RUN" =~ ^[0-9]+$ && "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p test/ui-evidence
          python3 - <<'PY'
          import datetime,json,os,pathlib,subprocess,time
          now=time.time()
          meta={key:os.environ[key] for key in ('CANDIDATE_SHA','HOST_KIND','SIMULATOR_RUNTIME','PACKAGE_RUN','EXERCISE_SCOPE','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT')}
          start=now
          query='repos/{}/actions/runs/{}/attempts/{}/jobs?per_page=100'.format(os.environ['GITHUB_REPOSITORY'],meta['GITHUB_RUN_ID'],meta['GITHUB_RUN_ATTEMPT'])
          suffix=' · '+meta['HOST_KIND']+' '+meta['SIMULATOR_RUNTIME']
          try:
              jobs=json.loads(subprocess.check_output(['gh','api',query],timeout=12,stderr=subprocess.DEVNULL))['jobs']
              started=next(j['started_at'] for j in jobs if j['name'].endswith(suffix) and j.get('started_at'))
              start=min(now,datetime.datetime.fromisoformat(started.replace('Z','+00:00')).timestamp())
          except (OSError,subprocess.SubprocessError,KeyError,ValueError,StopIteration):pass
          pathlib.Path('test/ui-evidence/preparation.json').write_text(json.dumps(dict(meta,jobStart=start,start=now,result='start')))
          with open(os.environ['GITHUB_ENV'],'a') as env:
              print('HOST_AUDIT_DEADLINE='+str(int(start)+32*60),file=env)
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PACKAGE_RUN" > test/build.json
          python3 - <<'PY'
          import base64, hashlib, hmac, json, os, pathlib
          run = json.loads(pathlib.Path("test/build.json").read_text())

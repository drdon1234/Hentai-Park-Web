[package]
name = "park-ffi"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
park-net = { path = "../park-net" }
park-runtime = { path = "../park-runtime" }
tokio = { version="1",features=["rt-multi-thread","time","net"] }
tokio-util = "0.7"
url = "2"
park-media = { path = "../park-media" }
park-storage = { path = "../park-storage" }
park-domain = { path = "../park-domain" }
uniffi.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
zip = { version="4", default-features=false, features=["deflate-flate2"] }
base64 = "0.22"
tempfile = "3"
cookie = "0.18"
fs2 = "0.4"
getrandom = "0.2"

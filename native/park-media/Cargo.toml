[package]
name = "park-media"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde_json = "1"
sha2 = "0.10"
axum = "0.8"
async-stream = "0.3"
futures-util = "0.3"
getrandom = "0.4"
park-net = { path = "../park-net" }
http = "1"
url = "2"
tokio = { version="1", features=["rt","net","time","fs","io-util"] }
image = { version="0.25", default-features=false, features=["png","jpeg","webp","gif","bmp"] }
tempfile = "3"
zip = { version="4", default-features=false }
pdf-writer = "0.14"
flate2 = "1"
aes = "0.8"
cbc = { version = "0.1", features = ["block-padding"] }
transmux = { version = "0.32.1", default-features = false }
broadcast-common = { version = "13.1.0", default-features = false }
tokio-util = "0.7"

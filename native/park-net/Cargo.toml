[package]
name = "park-net"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
park-storage = { path = "../park-storage" }
bytes = "1"
flate2 = "1"
cookie = "0.18"
cookie_store = "0.22"
http = "1"
hyper = { version = "1", features = ["http1","client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
psl = "2"
rustls = { version = "0.23", default-features = false, features = ["std","ring","tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring","tls12"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["net","time","rt","io-util","macros"] }
tokio-util = "0.7"
tokio-tungstenite = {version="0.28", default-features=false, features=["handshake"]}
futures-util = {version="0.3",features=["sink"]}
url = "2"
webpki-roots = "1"

[target.'cfg(any(target_vendor = "apple", target_os = "linux"))'.dependencies]
rustls-platform-verifier = "0.7"

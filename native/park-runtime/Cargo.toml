[package]
name = "park-runtime"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version="1",features=["derive"] }
sha2 = "0.10"
md-5 = "0.10"
park-net = { path = "../park-net" }
park-storage = { path = "../park-storage" }
http = "1"
tokio = { version="1",features=["rt","time","net"] }
tokio-util = "0.7"
url = "2"
rquickjs = "0.14"
serde_json = "1"
base64 = "0.22"
thiserror = "2"
tempfile = "3"
encoding_rs = "0.8"
getrandom = "0.4"

[target.'cfg(any(target_os = "android", target_vendor = "apple"))'.dependencies]
rquickjs = { version = "0.14", features = ["bindgen"] }
